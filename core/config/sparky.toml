# SPARKY Core configuration. Paths are absolute; weights live on D: (never in the repo).

[llm]
server = "D:/sparky-tools/llama-cpu/llama-server.exe"
model = "D:/sparky-models/gemma-4-E4B-it-Q4_0.gguf"   # Phase 0 pick; fallback: Qwen3.5-4B-Q4_K_M.gguf
port = 8091
threads = 4

[speech]
models = "D:/sparky-models/speech"
threads = 4
voice = "vits-piper-en_GB-alan-medium"

[gateway]
host = "127.0.0.1"   # USB via `adb reverse`; set to the LAN IP only on a trusted network
port = 8765

# Projects SPARKY may touch. Commands run from the project folder.
[projects.sparky]
path = "E:/sparky"
test = ".venv/Scripts/python.exe -m unittest discover -s core/tests"
