# FROSTI Core configuration. Paths are absolute; speech models live on D: (never in the repo).

[speech]
models = "D:/frosti-models/speech"
threads = 4
asr = "moonshine"   # or "parakeet": ~800 MB more RAM, same accuracy on FROSTI's commands (2026-11-12)
voice = "vits-piper-en_GB-jenny_dioco-medium"   # soft female; "kokoro-en-v0_19" (speaker 1 Bella) is more natural but ~350 MB more RAM, ~10x slower
speaker = 0

[gateway]
host = "127.0.0.1"   # USB via `adb reverse`; set to the LAN IP only on a trusted network
port = 8765

# Projects FROSTI may touch. Commands run from the project folder.
[projects.frosti]
path = "E:/frosti"
test = ".venv/Scripts/python.exe -m unittest discover -s core/tests"
