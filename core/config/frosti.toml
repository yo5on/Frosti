# FROSTI Core configuration. Paths are absolute; weights live on D: (never in the repo).

[llm]
server = "D:/frosti-tools/llama-cpu/llama-server.exe"
model = "D:/frosti-models/gemma-4-E4B-it-Q4_0.gguf"   # Phase 0 pick; fallback: Qwen3.5-4B-Q4_K_M.gguf
port = 8091
threads = 4

[speech]
models = "D:/frosti-models/speech"
threads = 4
voice = "kokoro-en-v0_19"
speaker = 1  # Bella

[gateway]
host = "127.0.0.1"   # USB via `adb reverse`; set to the LAN IP only on a trusted network
port = 8765

# Projects FROSTI may touch. Commands run from the project folder.
[projects.frosti]
path = "E:/frosti"
test = ".venv/Scripts/python.exe -m unittest discover -s core/tests"
